name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # 允许手动触发

jobs:
  test:
    # 单元测试：离线、无需 API key，作为每次提交的快速门槛
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  eval:
    # 端到端评测：下载语料 → 切分 → embedding → 检索/答案评测 → 报告。
    # 需要仓库 secrets.OPENAI_API_KEY；未配置则自动跳过。
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Check API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "HAS_KEY=0" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=1" >> "$GITHUB_ENV"
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Diagnose API connectivity
        if: env.HAS_KEY == '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          [ -n "$OPENAI_BASE_URL" ] || unset OPENAI_BASE_URL
          BASE="${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}"
          echo "解析到的 BASE_URL = $BASE"
          echo "API key 已配置: $([ -n "$OPENAI_API_KEY" ] && echo yes || echo no)"
          HOST=$(echo "$BASE" | sed -E 's|https?://||; s|/.*||')
          echo "域名 $HOST 的解析结果："
          getent hosts "$HOST" || echo "  (DNS 解析失败)"
          curl -sS -m 25 -o /dev/null -w "models 接口: http=%{http_code} 连接耗时=%{time_connect}s\n" \
            "$BASE/models" -H "Authorization: Bearer $OPENAI_API_KEY" || echo "curl 连接失败"

      - name: Run end-to-end eval
        if: env.HAS_KEY == '1'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          # 未配置 OPENAI_BASE_URL 时清空，让 config 用默认值（避免空字符串覆盖默认）
          [ -n "$OPENAI_BASE_URL" ] || unset OPENAI_BASE_URL
          python scripts/run_all.py --answer-limit 5

      - name: Upload report
        if: env.HAS_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: |
            data/output/report.md
            data/output/retrieval.png
